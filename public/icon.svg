<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient for dark hardware squircle -->
    <linearGradient id="casingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181a1f"/>
      <stop offset="60%" stop-color="#0f1013"/>
      <stop offset="100%" stop-color="#090a0c"/>
    </linearGradient>

    <!-- Diode Ambient Glow Filter -->
    <filter id="diodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Red Diode Gradient -->
    <radialGradient id="redDiode" cx="38%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#ff6b5e" />
      <stop offset="50%" stop-color="#ea3829" />
      <stop offset="90%" stop-color="#ba2316" />
      <stop offset="100%" stop-color="#8a1309" />
    </radialGradient>
  </defs>

  <!-- Hardware Squircle Casing (Matches Landing Logo) -->
  <rect x="48" y="48" width="928" height="928" rx="220" ry="220" fill="url(#casingGrad)" />
  <rect x="48" y="48" width="928" height="928" rx="220" ry="220" fill="none" stroke="#27272a" stroke-width="20" />
  <rect x="68" y="68" width="888" height="888" rx="200" ry="200" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4" />

  <!-- Center Signature Nothing Red Diode with Glow -->
  <!-- Ambient Red Halo -->
  <circle cx="512" cy="512" r="160" fill="#ea3829" opacity="0.32" filter="url(#diodeGlow)" />
  <circle cx="512" cy="512" r="110" fill="#ea3829" opacity="0.45" filter="url(#diodeGlow)" />

  <!-- Diode Bezel Ring -->
  <circle cx="512" cy="512" r="92" fill="#15161a" stroke="#27272a" stroke-width="6" />

  <!-- Pure Diode Lens -->
  <circle cx="512" cy="512" r="80" fill="url(#redDiode)" filter="url(#diodeGlow)" />

  <!-- Specular Lens Glint -->
  <circle cx="488" cy="488" r="24" fill="#ffffff" opacity="0.5" />
</svg>
