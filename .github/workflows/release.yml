name: Release Dock (1) Desktop

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de version (ex: v26.1)'
        required: false
        default: 'v26.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_script: 'app:dist:linux'
            artifact_pattern: 'release/*.{deb,AppImage,tar.gz}'
          - os: macos-latest
            target_script: 'app:dist:mac'
            artifact_pattern: 'release/*.{dmg,zip}'
          - os: windows-latest
            target_script: 'app:dist:win'
            artifact_pattern: 'release/*.{exe,zip}'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Web & Desktop App
        run: npm run ${{ matrix.target_script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
          name: Dock (1) ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: ${{ matrix.artifact_pattern }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
